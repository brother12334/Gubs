<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GUBS Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Home / lobby -->
  <section id="home" class="screen">
    <div class="home-card">
      <h1 class="logo">G<span>U</span>B<span>S</span></h1>
      <p class="tagline">A game of wit &amp; luck. Online with friends or bots, 2 to 6 players.</p>
      <label class="field">Your name <input id="name" maxlength="16" placeholder="Gub Keeper"></label>
      <div class="row">
        <button id="createBtn" class="btn gold">Create a table</button>
      </div>
      <div class="row join">
        <input id="codeInput" maxlength="4" placeholder="CODE" autocomplete="off">
        <button id="joinBtn" class="btn">Join table</button>
      </div>
      <details class="rules">
        <summary>How to play</summary>
        <div id="rulesText"></div>
      </details>
    </div>
  </section>

  <section id="lobby" class="screen hidden">
    <div class="home-card">
      <h2>Table <span id="lobbyCode" class="code"></span></h2>
      <p class="muted">Share this link with friends: <a id="shareLink" href="#"></a> <button id="copyBtn" class="btn small">Copy</button></p>
      <ul id="seatList" class="seats"></ul>
      <div class="row">
        <button id="addBotBtn" class="btn">+ Add bot</button>
        <button id="startBtn" class="btn gold">Start game</button>
      </div>
      <p id="lobbyNote" class="muted"></p>
    </div>
  </section>

  <!-- Table -->
  <section id="table" class="screen hidden">
    <header class="topbar">
      <div class="brand">GUBS <span class="code" id="tableCode"></span></div>
      <div id="letters" class="letters"></div>
      <div id="turnInfo" class="turn-info"></div>
      <button id="sideToggle" class="btn small">Log</button>
    </header>
    <main class="mat">
      <div id="opponents" class="opponents"></div>
      <div class="center">
        <div class="pile" id="deckPile">
          <div class="card back"><img src="cards/back.jpg" alt="Deck"></div>
          <div class="pile-label">Deck <b id="deckCount"></b></div>
        </div>
        <div id="banner" class="banner"></div>
        <div class="pile" id="discardPile">
          <div id="discardTop" class="card empty"></div>
          <div class="pile-label">Discard <b id="discardCount"></b></div>
        </div>
      </div>
      <div id="me" class="me"></div>
      <div class="controls" id="controls"></div>
      <div id="hand" class="hand"></div>
    </main>
    <aside id="side" class="side">
      <div class="side-head">Game log</div>
      <ol id="log" class="log"></ol>
      <div class="side-head">Chat</div>
      <div id="chat" class="chat"></div>
      <form id="chatForm" class="chat-form"><input id="chatInput" maxlength="200" placeholder="Say something…"><button class="btn small">Send</button></form>
    </aside>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
  <div id="zoom" class="zoom hidden"></div>
  <div id="toast" class="toast"></div>

  <script src="/shared/cards.js"></script>
  <script src="client.js"></script>
</body>
</html>
